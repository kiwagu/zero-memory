# Supabase CLI configuration.
# Reference: https://supabase.com/docs/guides/local-development/cli/config
project_id = "zero-memory"

[api]
enabled = true
# Port to use for the API URL.
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
# Ports for CLI-managed containers (`supabase start` / shadow DB for `db diff`).
# Keep away from the self-hosted stack host mappings in infra/dev/supabase to
# avoid bind conflicts.
port = 55322
shadow_port = 55320
# The database major version to use. Must match the self-hosted stack.
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 55323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 55324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
# Web dashboard base URL — email confirmation / recovery links redirect here.
site_url = "http://127.0.0.1:3100"
# Every origin the dashboard is reached by belongs here, `zm.local` included:
# the dashboard asks Auth to return the user to `${window.location.origin}/auth/callback`,
# and an origin missing from this list is replaced by `site_url` SILENTLY — the mail
# then arrives with a link that only works on the host machine.
additional_redirect_urls = [
  "http://127.0.0.1:3100/**",
  "http://localhost:3100/**",
  "http://zm.local:3100/**",
]
# 8h access tokens: refresh works, but a longer lifetime makes re-auth rare
# even if a client is lax about refreshing on the hourly boundary.
jwt_expiry = 28800
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

# Our own templates instead of the built-in ones, so what the mail catcher shows
# is the markup a real user receives. Generated — edit the components in
# packages/email and re-run `bun run --cwd packages/email mail:export`; the
# subjects below come from the mail catalog and `mail:check` fails if they drift.
[auth.email.template.confirmation]
subject = "Confirm your email address"
content_path = "./apps/web/public/email-templates/confirmation.en.html"

[auth.email.template.recovery]
subject = "Reset your password"
content_path = "./apps/web/public/email-templates/recovery.en.html"

[auth.email.template.email_change]
subject = "Confirm your new email address"
content_path = "./apps/web/public/email-templates/email_change.en.html"

[auth.email.template.invite]
subject = "You have been invited to zero-memory"
content_path = "./apps/web/public/email-templates/invite.en.html"

[edge_runtime]
enabled = false

[analytics]
enabled = false
