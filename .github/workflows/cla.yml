name: cla

# The contributor agreement is signed by comment on the first pull request.
# Signatures are stored in this repository on a dedicated branch, so the
# workflow needs no secret beyond the token GitHub already provides.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, closed]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  signature:
    name: contributor agreement
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      contains(github.event.comment.body, 'I hereby sign the CLA') ||
      github.event.comment.body == 'recheck'
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          branch: cla-signatures
          path-to-signatures: signatures/cla.json
          # Resolved at run time so the workflow carries no hard-coded
          # repository name and keeps working after a fork or a rename.
          path-to-document: ${{ github.server_url }}/${{ github.repository }}/blob/HEAD/CLA.md
          custom-notsigned-prcomment: >-
            Thanks for the pull request. Before it can be merged, please read
            the [contributor agreement](${{ github.server_url }}/${{ github.repository }}/blob/HEAD/CLA.md)
            and post the sentence below as a comment on this pull request.
          custom-pr-sign-comment: I have read the CLA document and I hereby sign the CLA
          custom-allsigned-prcomment: Contributor agreement signed — thank you.
          allowlist: dependabot[bot],bot*
